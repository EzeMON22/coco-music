<style>
:root{--bg:#FFF6E9;--ink:#1E1A2B;--card:#fff;--coral:#FF5A4F;--sun:#FFC229;--teal:#17C3B2;--vio:#6C3CE9;--line:rgba(30,26,43,.15);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241B3A;--ink:#FFF6E9;--card:#2F2449;--line:rgba(255,246,233,.2);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241B3A;--ink:#FFF6E9;--card:#2F2449;--line:rgba(255,246,233,.2);color-scheme:dark}
html{scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 'DM Sans',system-ui,sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--vio);z-index:30}
h1,h2,h3{font-family:'Unbounded','DM Sans',system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--vio);color:#FFF6E9;border-bottom:4px solid var(--sun);display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding:12px 5vw}
.logo{font:800 1.15rem 'Unbounded',sans-serif;text-decoration:none;display:flex;align-items:center;gap:10px}
.mk{height:56px;width:auto;display:block;margin:-4px 0}
header :focus-visible,footer :focus-visible,#pl :focus-visible{outline-color:var(--sun)}
nav{display:flex;flex-wrap:wrap;gap:4px 22px;font-weight:700}
nav a{text-decoration:none;padding:4px 0;border-bottom:3px solid transparent}
nav a.on,nav a:hover{border-color:var(--sun)}
.wrap{padding:0 5vw}
section{padding:56px 0 8px}
.hero{background:linear-gradient(135deg,#6C3CE9 0%,#B24BA8 55%,#FF5A4F 100%);color:#FFF6E9;display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;padding:48px 5vw}
.hero h1{font-size:clamp(2.1rem,5.6vw,4.4rem);font-weight:800}
.hero p{max-width:46ch;font-size:1.15rem}
.btn{display:inline-block;border:2px solid #1E1A2B;background:var(--coral);color:#1E1A2B;font:700 1rem 'DM Sans',sans-serif;padding:12px 22px;min-height:44px;border-radius:999px;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:inherit}
.hero .btn{background:var(--sun)}
.hero .btn.alt{background:transparent;border-color:#FFF6E9}
.lg{max-width:420px;justify-self:center;width:100%;cursor:pointer;border:4px solid #FFF6E9;border-radius:28px;overflow:hidden;box-shadow:8px 8px 0 #1E1A2B;transform:rotate(2deg);line-height:0}
.lgsvg{width:100%;height:auto;display:block}
.btn:hover{transform:translateY(-2px)}
.disc{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 30%,var(--coral) 0 46%,#1E1A2B 46.5% 47.5%,var(--teal) 48% 100%);border:3px solid #1E1A2B;display:grid;place-items:center;max-width:380px;justify-self:center;width:100%;cursor:pointer;color:#1E1A2B;font:800 1.1rem 'Unbounded',sans-serif;text-align:center;padding:30px}
.disc small{display:block;font:500 .85rem 'DM Sans',sans-serif}
.row{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.row h2{font-size:clamp(1.5rem,3.4vw,2.2rem)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;overflow:hidden;text-decoration:none;display:block;text-align:left;font:inherit;color:inherit;padding:0;cursor:pointer}
.card:hover{transform:translateY(-3px)}
.cv .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv{position:relative;overflow:hidden;aspect-ratio:1;display:grid;place-items:center;font:800 3.2rem 'Unbounded',sans-serif;color:#1E1A2B}
.card div.t{padding:12px 14px 16px}
.card h3{font-size:1rem}
.card p{margin:4px 0 0;font-size:.92rem;opacity:.8}
.big{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:0;max-width:880px}
.big .cv{aspect-ratio:auto;min-height:220px;font-size:5rem}
.big .t{padding:24px}
.tag{display:inline-block;background:var(--ac,var(--sun));color:#1E1A2B;font-weight:700;font-size:.85rem;padding:2px 12px;border-radius:999px;border:2px solid #1E1A2B}
.band{background:var(--teal);color:#1E1A2B;margin-top:64px;padding:44px 5vw;display:flex;gap:24px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.band h2{font-size:clamp(1.4rem,3vw,2rem);max-width:20ch}
.news{border-top:2px solid var(--ink);padding:18px 0;max-width:720px}
.news small{opacity:.75}
.t .cd{display:inline-block;font-weight:700;font-size:.85rem;background:var(--sun);color:#1E1A2B;border-radius:999px;padding:2px 12px;margin-top:8px;opacity:1}
.news h3{font-size:1.1rem;margin:4px 0}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;min-height:44px;width:100%}
.filters input,.filters select{width:auto;flex:1 1 180px}
label{display:block;font-weight:700;margin:14px 0 6px}
form{max-width:560px}
.ban{padding:44px 5vw;color:#1E1A2B;background:var(--ac)}
.ban h1{font-size:clamp(2rem,5vw,3.6rem)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:36px}
.list{list-style:none;padding:0;margin:0}
.list li{border-top:2px solid var(--ink);padding:12px 0;display:flex;justify-content:space-between;gap:12px}
footer{margin-top:72px;background:#1E1A2B;color:#FFF6E9;border-top:4px solid var(--sun);padding:28px 5vw;display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
footer nav{font-weight:500}
.note{font-size:.9rem;opacity:.8}
#pl{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#1E1A2B;border-top:3px solid var(--coral);color:#FFF6E9;display:flex;align-items:center;gap:14px;padding:10px 5vw calc(10px + env(safe-area-inset-bottom,0px))}
#pl .cv{width:48px;aspect-ratio:1;border-radius:10px;font-size:1.2rem;border:2px solid #fff;flex:none}
#pl b{display:block;line-height:1.2}
#pl small{opacity:.85}
#pp{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:var(--sun);color:#1E1A2B;font-size:1.1rem;cursor:pointer;flex:none}
.bar{flex:1;height:6px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;width:0;background:var(--sun)}
.on-air .bar i{animation:go 30s linear infinite}
@keyframes go{to{width:100%}}
@media (prefers-reduced-motion:reduce){.on-air .bar i{animation:none;width:40%}.btn:hover,.card:hover{transform:none}}
@media (max-width:760px){.hero,.two,.big{grid-template-columns:1fr}.lg{max-width:300px}#pl small{display:none}}
</style></head>

const A=[{id:'djcoco',img:'dj-coco.jpg',n:'DJ Coco',g:'Techno y house',p:'Argentina',c:'#FF5A4F',t:'Techno y house para la pista.',b:'Texto de ejemplo: DJ Coco hoy se mueve entre el techno y el house, con sets pensados para bailar toda la noche. Acá va su biografía real.'}];
const R=[{id:1,t:'Pista Cocotera',k:'Single',a:'DJ Coco',y:2026,c:['#FF5A4F','#FFC229']},{id:2,t:'Cumbia Láser',k:'EP',a:'DJ Coco',y:2026,c:['#17C3B2','#6C3CE9']},{id:3,t:'Noche de Coco',k:'Single',a:'DJ Coco',y:2025,c:['#FFC229','#17C3B2']}];
const N=[{d:'12 oct 2026',t:'Se viene el primer EP del sello',x:'Noticia de ejemplo para mostrar cómo se ve una entrada.'},{d:'28 sep 2026',t:'DJ Coco confirmado para su próxima fecha',x:'Noticia de ejemplo sobre shows en vivo.'}];
const G=['Techno y house','Cumbia digital','Reggaetón electrónico'],P=['Argentina','Chile','Perú','Bolivia'],C=['#FF5A4F','#FFC229','#17C3B2','#6C3CE9'];
const D=A.concat(Array.from({length:11},(_,i)=>({id:'x'+i,n:'Artista '+(i+2),g:G[i%3],p:P[i%4],c:C[i%4],t:'',b:'Datos de prueba.'})));
let demo=false,np=R[0],on=false;
const $=s=>document.querySelector(s),v=$('#v');
const cover=r=>`<div class="cv" style="background:linear-gradient(135deg,${r.c[0]},${r.c[1]})">${r.t[0]}</div>`;
const cdMs=f=>new Date(f+'T00:00:00-03:00')-Date.now();
const cdTxt=ms=>{const m=Math.floor(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return 'Faltan '+(d?d+(d===1?' día, ':' días, '):'')+h+' h '+(m%60)+' min'};
const cd=r=>r.f&&cdMs(r.f)>0?`<p class="cd" data-cd="${r.f}">${cdTxt(cdMs(r.f))}</p>`:'';
const rel=r=>`<button class="card" data-play="${r.id}">${cover(r)}<div class="t"><h3>${r.t}</h3><p>${r.a}, ${r.k} ${r.y}</p>${cd(r)}</div></button>`;
const pic=a=>a.img?`<img class="ph" src="${a.img}" alt="Foto de ${a.n}" loading="lazy" onerror="this.remove()">`:'';
const art=a=>`<a class="card" href="#/artista/${a.id}"><div class="cv" style="background:${a.c}">${a.n[0]}${pic(a)}</div><div class="t"><h3>${a.n}</h3><p>${a.g}, ${a.p}</p></div></a>`;
const bigart=a=>`<a class="card big" href="#/artista/${a.id}" style="--ac:${a.c}"><div class="cv" style="background:${a.c}">${a.n[0]}${pic(a)}</div><div class="t"><span class="tag">${a.g}</span><h3 style="font-size:1.8rem;margin:12px 0 8px">${a.n}</h3><p style="opacity:1">${a.t}</p><p>Ver ficha y discografía</p></div></a>`;
const cal=n=>{if(!n.e||new Date(n.e+'T23:59:59-03:00')<Date.now())return '';let s,t;const f=x=>x.toISOString().slice(0,19).replace(/[-:]/g,'');
if(n.h){const a=new Date(n.e+'T'+n.h+':00Z');s=f(a);t=f(new Date(a.getTime()+72e5))}else{const a=new Date(n.e+'T00:00:00Z');s=f(a).slice(0,8);t=f(new Date(a.getTime()+864e5)).slice(0,8)}
const u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(n.t)+'&dates='+s+'/'+t+(n.h?'&ctz=America/Argentina/Cordoba':'')+'&details='+encodeURIComponent(n.x)+(n.l?'&location='+encodeURIComponent(n.l):'');
return `<p><a class="btn alt" href="${u}" target="_blank" rel="noopener">Agendar en mi calendario</a></p>`};
const news=n=>`<div class="news"><small>${n.d}</small><h3>${n.t}</h3><p>${n.x}</p>${cal(n)}</div>`;
const list=(s)=>s.length<=3?`<div style="display:grid;gap:22px">${s.map(bigart).join('')}</div>`:`<div class="grid">${s.map(art).join('')}</div>`;
const V={
home:()=>`<div class="hero"><div><h1>Música electrónica hecha en Argentina.</h1><p>Coco Music Producciones es un sello abierto a todos los estilos, y cada artista trae el suyo. Escuchá lo último y conocé a los artistas.</p><p><button class="btn" data-play="1">Escuchar ahora</button> <a class="btn alt" href="#/artistas">Ver artistas</a></p></div><div class="lg" data-play="1" role="button" tabindex="0" aria-label="Escuchar el último lanzamiento">${LOGO}</div></div>
<div class="wrap"><section><div class="row"><h2>Artistas</h2><a href="#/artistas">Ver todos</a></div>${list(A)}</section>
<section><div class="row"><h2>Últimos lanzamientos</h2><a href="#/lanzamientos">Ver todos</a></div><div class="grid">${R.map(rel).join('')}</div></section>
<section><div class="row"><h2>Noticias</h2><a href="#/noticias">Ver todas</a></div>${N.map(news).join('')}</section></div>
<div class="band"><h2>¿Tenés música propia? Mandanos tu demo.</h2><a class="btn alt" style="background:#fff" href="#/demo">Enviar demo</a></div>`,
artistas:()=>{const s=demo?D:A;return `<div class="wrap"><section><div class="row"><h2>Artistas</h2><button class="btn alt" id="dm">${demo?'Volver a 1 artista':'Probar con 12 artistas'}</button></div>
${s.length>3?`<div class="filters"><input id="q" placeholder="Buscar artista" aria-label="Buscar artista"><select id="g" aria-label="Género"><option value="">Todos los géneros</option>${G.map(x=>`<option>${x}</option>`).join('')}</select></div>`:''}
<div id="al">${list(s)}</div><p class="note">Con pocos artistas se muestran tarjetas grandes. Al crecer el roster aparecen la grilla, el buscador y los filtros, sin rediseñar nada.</p></section></div>`},
artista:id=>{const a=D.find(x=>x.id===id)||A[0];return `<div class="ban" style="--ac:${a.c}"><span class="tag" style="background:#fff">${a.g}</span><h1 style="margin-top:14px">${a.n}</h1><p style="font-size:1.2rem">${a.t||a.p}</p><button class="btn alt" style="background:#fff" data-play="1">Escuchar</button></div>
<div class="wrap"><section class="two"><div><h2 style="font-size:1.5rem;margin-bottom:12px">Biografía</h2><p>${a.b}</p><h2 style="font-size:1.5rem;margin:32px 0 16px">Discografía</h2><div class="grid">${R.filter(r=>r.a===a.n).map(rel).join('')||'<p class="note">Sin lanzamientos cargados.</p>'}</div></div>
<div><h2 style="font-size:1.5rem;margin-bottom:12px">Próximas fechas</h2><ul class="list"><li><span>Fecha a confirmar</span><span>Córdoba</span></li><li><span>Fecha a confirmar</span><span>Buenos Aires</span></li></ul><p><a class="btn alt" href="#/contacto">Contratar para un show</a></p><p class="note">Fotos y bio para prensa: <a href="#/contacto">escribinos desde Contacto</a>.</p></div></section></div>`},
lanzamientos:()=>`<div class="wrap"><section><div class="row"><h2>Lanzamientos</h2></div><div class="grid">${R.map(rel).join('')}</div><p class="note">Tocá una portada para escucharla en el reproductor (prototipo sin audio).</p></section></div>`,
noticias:()=>`<div class="wrap"><section><div class="row"><h2>Noticias</h2></div>${N.map(news).join('')}</section></div>`,
nosotros:()=>`<div class="wrap"><section style="max-width:640px"><h2 style="margin-bottom:16px">Nosotros</h2><p>Coco Music Producciones es un sello argentino de música electrónica y géneros afines. No nos encasillamos en un solo estilo: cada artista suma su propia impronta, de la cumbia digital al techno y el house. Empezamos en Argentina y apuntamos a crecer por Latinoamérica.</p><p class="note">Texto de ejemplo. Acá van la historia real, el equipo y el contacto.</p></section></div>`,
contacto:()=>`<div class="wrap"><section style="max-width:640px"><h2 style="margin-bottom:16px">Contacto</h2><ul class="list"><li><b>Correo</b><a href="mailto:CocoMusicProducciones@gmail.com">CocoMusicProducciones@gmail.com</a></li><li><b>WhatsApp</b><a href="https://wa.me/5493516558562?text=${encodeURIComponent('Hola, les escribo desde la web de Coco Music Producciones.')}" target="_blank" rel="noopener">+54 9 351 655-8562</a></li><li><b>Instagram</b><a href="https://www.instagram.com/cocomusicproducciones/" target="_blank" rel="noopener">@cocomusicproducciones</a></li></ul><p><a class="btn" href="https://wa.me/5493516558562?text=${encodeURIComponent('Hola, les escribo desde la web de Coco Music Producciones.')}" target="_blank" rel="noopener">Escribinos por WhatsApp</a></p><p class="note">Para shows, prensa, demos y consultas en general.</p></section></div>`,
demo:()=>`<div class="wrap"><section><h2 style="margin-bottom:12px">Enviá tu demo</h2><p style="max-width:56ch">Buscamos electrónica, cumbia digital, reggaetón, techno, house y todo lo que tenga identidad propia. Pasanos un enlace a tu música (no adjuntes archivos pesados) y te respondemos en un plazo de 30 días.</p>
<form id="df"><label for="n1">Nombre artístico</label><input id="n1" required><label for="e1">Correo</label><input id="e1" type="email" required><label for="l1">Enlace a tu música</label><input id="l1" type="url" required><label for="m1">Contanos de tu proyecto</label><textarea id="m1" rows="4"></textarea><p><button class="btn" type="submit">Enviar demo</button></p></form></section></div>`};
function route(){const h=location.hash.slice(2).split('/'),k=h[0]||'home';v.innerHTML=(V[k]||V.home)(h[1]);scrollTo(0,0);document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k||(k==='artista'&&a.dataset.k==='artistas')))}
function setNP(){$('#plc').outerHTML=cover(np).replace('class="cv"','class="cv" id="plc"');$('#plt').textContent=np.t;$('#pla').textContent=np.a+', '+np.k;$('#pp').textContent=on?'❚❚':'▶';$('#pl').classList.toggle('on-air',on)}
function filt(){const q=($('#q').value||'').toLowerCase(),g=$('#g').value;$('#al').innerHTML=`<div class="grid">${D.filter(a=>a.n.toLowerCase().includes(q)&&(!g||a.g===g)).map(art).join('')||'<p>No hay artistas con esos filtros.</p>'}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-play]');if(b){np=R.find(r=>r.id==b.dataset.play);on=true;setNP()}
if(e.target.id==='dm'){demo=!demo;route()}if(e.target.closest('#pp')){on=!on;setNP()}});
document.addEventListener('input',e=>{if(e.target.id==='q'||e.target.id==='g')filt()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.classList.contains('disc')||e.target.classList.contains('lg')))e.target.click()});
document.addEventListener('submit',e=>{if(e.target.id==='df'){e.preventDefault();const g=i=>$('#'+i).value.trim(),n=g('n1'),c=g('e1'),l=g('l1'),m=g('m1');
const u='mailto:CocoMusicProducciones@gmail.com?subject='+encodeURIComponent('Demo: '+n)+'&body='+encodeURIComponent('Nombre artístico: '+n+'\nCorreo: '+c+'\nEnlace a mi música: '+l+'\n\nSobre mi proyecto:\n'+m);
e.target.innerHTML='<h3>Ya casi está.</h3><p>Se abrió tu aplicación de correo con el demo listo para enviar. Apretá Enviar y te respondemos en un plazo de 30 días.</p><p class="note">Si no se abrió, escribinos a <a href="mailto:CocoMusicProducciones@gmail.com">CocoMusicProducciones@gmail.com</a> con tu enlace.</p>';location.href=u}});
addEventListener('hashchange',route);route();setNP();
setInterval(()=>document.querySelectorAll('[data-cd]').forEach(e=>{const ms=cdMs(e.dataset.cd);if(ms>0)e.textContent=cdTxt(ms);else e.remove()}),30000);
</script></body></html>
